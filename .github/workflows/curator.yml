name: Daily Curator

on:
  schedule:
    # Primary run, 06:00 UTC. Mid-morning CEST — far from any midnight
    # boundary, so the commit lands on the intended day in both UTC and
    # the maintainer's local timezone.
    - cron: "0 6 * * *"
    # Safety net, 17:00 UTC. GitHub's scheduled workflows are best-effort and
    # get dropped under load; this second window only acts if the day has no
    # commit yet, so a skipped morning run can't break the daily streak.
    - cron: "0 17 * * *"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write
  actions: write # required for `gh workflow run` dispatch of the Pages deploy

concurrency:
  group: curator
  cancel-in-progress: false

env:
  # Commits must be authored by a real, account-linked identity or GitHub
  # never counts them as contributions. The noreply address is permanently
  # linked to the account and keeps the private email out of git history.
  GIT_AUTHOR_NAME: FelixKruger
  GIT_AUTHOR_EMAIL: 262215022+FelixKruger@users.noreply.github.com

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The 17:00 safety net is a no-op unless the day is still missing a
      # commit. The 06:00 run and manual dispatches always proceed.
      - name: Decide whether to run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event.schedule }}" != "0 17 * * *" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Primary run or manual dispatch — proceeding."
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(gh api "repos/${{ github.repository }}/commits?since=${TODAY}T00:00:00Z&sha=main" \
                    --jq "[.[] | select(.commit.author.email == \"$GIT_AUTHOR_EMAIL\")] | length")
          if [[ "$COUNT" -gt 0 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Safety net: $COUNT commit(s) already today — nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Safety net: no commit yet today — running the curator."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Configure git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      # The curator commits each unit of work itself — a link check, an added
      # tool, a pruned entry and a rewritten guide are separate changes and
      # belong in separate commits. Nothing is pushed until the end.
      - name: Run curator
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Raises the GitHub API rate limit for the adoption-signal lookups
          # that guard against pruning a widely used tool.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/curator.py --commit

      - name: Re-render site
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/render.py
          git add README.md feed.xml HEALTH.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: regenerate site and health report"

      - name: Push
        if: steps.gate.outputs.run == 'true'
        run: |
          if [[ -z "$(git log origin/main..HEAD --oneline)" ]]; then
            echo "Nothing to push."
            exit 0
          fi
          echo "Commits to push:"
          git log origin/main..HEAD --pretty='  %s'
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      - name: Verify the commit counts as a contribution
        if: steps.gate.outputs.run == 'true'
        run: |
          AUTHOR=$(git log -1 --pretty='%ae')
          echo "Latest commit author: $AUTHOR"
          if [[ "$AUTHOR" != "$GIT_AUTHOR_EMAIL" ]]; then
            echo "::error::Commit authored by '$AUTHOR', not '$GIT_AUTHOR_EMAIL'."
            echo "::error::GitHub will NOT count this toward the contribution graph."
            exit 1
          fi
          echo "✓ Authored by an account-linked address — counts as a contribution."

      - name: Trigger Pages deploy
        if: steps.gate.outputs.run == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
